# =============================================================================
# 前端访问模式：开发（Development）
# =============================================================================
# 由 scripts/render_nginx.sh 渲染并安装为：
#   /etc/nginx/snippets/green-tracker-frontend.conf
#
# 行为：所有页面请求反向代理到本地 Vite 开发服务器（127.0.0.1:${FRONTEND_PORT}），
#       支持热模块替换（HMR），修改源码后浏览器自动刷新。
# 适用：make dev / make serve-dev
#
# 占位符：${FRONTEND_PORT}
# =============================================================================

location / {
    # 代理到本地 Vite 开发服务器（HMR 热加载）
    proxy_pass http://127.0.0.1:${FRONTEND_PORT};

    # Vite HMR 必需头
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # WebSocket / HMR 超时（默认 60s 会被切断，禁用超时）
    proxy_read_timeout  86400s;
    proxy_send_timeout  86400s;
    proxy_connect_timeout 10s;

    # 关闭缓冲，实时输出日志
    proxy_buffering off;
}
