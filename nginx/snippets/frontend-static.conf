# =============================================================================
# 前端访问模式：生产（Production / 静态成品）
# =============================================================================
# 由 scripts/render_nginx.sh 渲染并安装为：
#   /etc/nginx/snippets/green-tracker-frontend.conf
#
# 行为：Nginx 直接服务 Vite 构建产物（frontend/dist），不经过 Node 进程，
#       无需开发服务器，性能最好、资源占用最低；无法热加载（发版需重新构建）。
# 适用：make serve-prod（需先 make build）
#
# 占位符：STATIC_ROOT（渲染后为 frontend/dist 的绝对路径）
# =============================================================================

# SPA 前端路由回退：任何未匹配到实体文件的路径都返回 index.html，
# 保证刷新 /dashboard/api-keys 等子路由不会 404。
location / {
    root ${STATIC_ROOT};
    try_files $uri $uri/ /index.html;
}

# index.html 不缓存，保证发版后用户立即拿到新版本
location = /index.html {
    root ${STATIC_ROOT};
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Vite 构建产物文件名含内容哈希，可长期强缓存
location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|ttf|eot|map)$ {
    root ${STATIC_ROOT};
    expires 7d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}
