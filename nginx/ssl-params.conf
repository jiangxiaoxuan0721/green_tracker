# =============================================================================
# Green Tracker - SSL 通用参数
# =============================================================================
# 由 nginx/green-tracker.conf 通过 include 引用
# 仅在启用 HTTPS 时生效

# SSL 协议与加密套件（兼容主流浏览器，禁用过时的 SSLv3 / TLSv1 / TLSv1.1）
ssl_protocols TLSv1.2 TLSv1.3;

# Mozilla 中等兼容性配置（兼顾安全与旧客户端）
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# SSL session 缓存（提升 HTTPS 握手性能）
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# OCSP Stapling（验证证书有效性，减少客户端验证耗时）
ssl_stapling on;
ssl_stapling_verify on;

# 安全响应头
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# HSTS（强制 HTTPS，告知浏览器一年内始终使用 HTTPS）
# 注意：仅在确认 HTTPS 永久可用后再启用，否则会"锁死"无法回退到 HTTP
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;