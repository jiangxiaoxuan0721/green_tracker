[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "green_tracker_backend"
version = "0.1.0"
description = "Backend for Green Tracker application"
authors = [
    {name = "JiangXiaoXuan", email = "3335447591@qq.com"},
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi==0.124.4",
    "python-dotenv==1.2.1",
    "uvicorn==0.38.0",
    "greenlet==3.3.0",
    "sqlalchemy==2.0.45",
    "psycopg2-binary==2.9.11",
    "passlib==1.7.4",
    "python-jose[cryptography]==3.3.0",
    "email-validator==2.3.0",
    "dnspython==2.8.0",
    "geoalchemy2==0.18.1",
    "minio==7.2.20",
    "python-magic==0.4.27",
    "python-multipart==0.0.22",
    "Pillow==12.1.1",
    "redis==5.0.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "paho-mqtt>=1.6.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["database*"]

[tool.setuptools.package-dir]
"" = "."

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true